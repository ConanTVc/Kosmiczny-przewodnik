# Sprawdzenie zmian w pull requestach: lint, formatowanie, typy, testy i budowanie.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testy i typy korzystają ze zbudowanej treści (packages/content/dist).
      - run: pnpm content:build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Budowanie
        run: |
          pnpm --filter @kp/userscript build
          pnpm --filter @kp/pwa build
