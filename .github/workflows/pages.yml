# Buduje i publikuje na GitHub Pages: stronę startową, aplikację na telefon (app/),
# treść solucji (content/) i skrypt do gry (kosmiczny-przewodnik.user.js + meta.js).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testy i typy korzystają ze zbudowanej treści (packages/content/dist).
      - run: pnpm content:build

      - name: Sprawdzenie (lint, format, typy, testy)
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test

      - name: Budowanie
        run: |
          pnpm --filter @kp/userscript build
          pnpm --filter @kp/pwa build

      - name: Złożenie strony
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -r packages/content/dist/content _site/content
          cp -r apps/pwa/dist _site/app
          cp apps/userscript/dist/kosmiczny-przewodnik.user.js apps/userscript/dist/kosmiczny-przewodnik.meta.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
